spring.application.name=soldmate-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database (Docker local, Postgres en host, o Postgres de Supabase vía JDBC)
# Supabase (Settings → Database): host db.<ref>.supabase.co, puerto 5432, DB "postgres", añade ?sslmode=require en la URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:10}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
soldmate.jwt.secret=${SOLDMATE_JWT_SECRET:cambia-esto-por-una-clave-muy-larga-min-32-chars}
soldmate.jwt.expiration=86400000

# Supabase Storage
soldmate.supabase.url=${SOLDMATE_SUPABASE_URL:https://placeholder.supabase.co}
soldmate.supabase.anon-key=${SOLDMATE_SUPABASE_ANON_KEY:placeholder-key}
# Debe coincidir con un bucket creado en Supabase → Storage (o sobreescribe con SUPABASE_STORAGE_BUCKET en .env)
soldmate.supabase.bucket=${SOLDMATE_SUPABASE_BUCKET:incidents}
soldmate.seed.enabled=${SOLDMATE_SEED_ENABLED:false}

# Railway inyecta PORT automáticamente; localmente usamos 8080
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
