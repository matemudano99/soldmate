name: Backend tests

# Red de seguridad: los tests no corren en el build de Docker (usa -DskipTests para que
# los despliegues locales sean rápidos), así que la puerta de calidad es este workflow.
on:
  push:
    branches: [main]
    paths:
      - 'soldmate-backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'soldmate-backend/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: mvn test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar tests
        working-directory: soldmate-backend
        run: mvn -B test

      # Deja los informes de Surefire descargables aunque los tests fallen, para
      # poder ver qué reventó sin repetir la ejecución en local.
      - name: Publicar informes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: soldmate-backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
